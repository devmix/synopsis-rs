# Release Pipeline — cross-build, package and publish on version tags (v*).
# Single job (change make-ci-gitea-compatible, design D1): the Gitea runner has
# no artifact service, so archives cannot be passed between jobs. One `release`
# job cross-compiles the release binary for each of the 5 supported targets via
# cargo-zigbuild (sequentially, on the same runner), strips each binary, and
# packages a per-platform archive `synopsis_<version>_<name>.<ext>` bundling the
# stripped binary, README.md, workspace/configs/** and
# workspace/datasets/edtech/ontology/** (the ONNX runtime library and model
# weights are gitignored runtime artifacts the binary downloads per onnx.yaml,
# and the demo corpus is not shipped). After the loop it writes SHA256SUMS.txt
# and publishes the Gitea Release (design D2). The 5-target build lives here
# and only here — the dev CI (ci.yml) stays fast.
name: Release

# Flow style keeps the block below at column 0 (see the single-job layout note
# above): the tag trigger is `v*`.
on: { push: { tags: ['v*'] } }

# The release job creates the Gitea Release, which needs to write contents;
# everything else only reads the repository.
permissions: { contents: write }

jobs:
  # ------------------------------------------------------------------
  # Release — one job does everything on a single runner (design D1):
  # build all 5 targets, package each archive, write the checksum file,
  # publish. No artifacts are passed between jobs because Gitea has no
  # artifact service.
  # ------------------------------------------------------------------
  release:
    name: Build, package and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Full history so the tag (and thus the version) is available.
          fetch-depth: 0

      # Same pinned toolchain as the dev CI (rust-toolchain.toml, 1.96.0).
      # All five targets are installed up front because this single job
      # cross-compiles for each of them in turn; no clippy/rustfmt
      # components are needed — only the target stds.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: x86_64-unknown-linux-musl, aarch64-unknown-linux-gnu, aarch64-unknown-linux-musl, x86_64-pc-windows-gnu, aarch64-apple-darwin

      # Caches ~/.cargo (registry, git deps) and ./target; keyed by the
      # installed rustc version, so it must run after the toolchain step.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Install cargo-zigbuild from crates.io — the method documented in
      # its README. The binary lands in CARGO_HOME, which the rust-cache
      # step above already caches, so only a cold cache pays the compile;
      # --locked pins the exact dependency set from its Cargo.lock for
      # reproducibility.
      - name: Install cargo-zigbuild
        run: cargo install --locked cargo-zigbuild

      # Zig 0.16.0 is the current stable release (ziglang.org, verified
      # 2026-08-18); the action caches the tarball by version.
      - name: Install Zig 0.16.0
        uses: mlugg/setup-zig@v2
        with:
          version: "0.16.0"

      # Build and package every target on this single runner (design D1).
      # For each target the loop cross-compiles the release binary, strips
      # it, and rebuilds a clean stage/ directory bundling the stripped
      # binary, README.md, the config presets and the ontology data;
      # everything else (notably the downloaded runtime library and model
      # weights) is intentionally excluded (design D4 of rebuild-ci-cd).
      # zig objcopy handles all three object formats (ELF, PE/COFF,
      # Mach-O) with one command, unlike the host strip (ELF/PE only).
      # The rows below are the target → archive name/extension mapping.
      - name: Build and package all targets
        run: |
          set -euo pipefail
          # Each row: <target>:<archive name>:<archive extension>.
          targets=(
            "x86_64-unknown-linux-musl:linux_amd64:tar.gz"
            "aarch64-unknown-linux-gnu:linux_arm64_gnu:tar.gz"
            "aarch64-unknown-linux-musl:linux_arm64_musl:tar.gz"
            "x86_64-pc-windows-gnu:windows_amd64:zip"
            "aarch64-apple-darwin:darwin_arm64:tar.gz"
          )
          mkdir -p dist
          for row in "${targets[@]}"; do
            IFS=':' read -r target name ext <<< "${row}"
            cargo zigbuild --release --target "${target}"
            bin="target/${target}/release/synopsis"
            case "${target}" in
              *-pc-windows-*)
                bin="${bin}.exe"
                binname="synopsis.exe"
                ;;
              *)
                binname="synopsis"
                ;;
            esac
            zig objcopy --strip-all "${bin}"
            rm -rf stage
            mkdir -p stage/workspace/datasets/edtech
            cp "${bin}" "stage/${binname}"
            cp README.md stage/
            cp -r workspace/configs stage/workspace/configs
            cp -r workspace/datasets/edtech/ontology stage/workspace/datasets/edtech/ontology
            archive="dist/synopsis_${GITHUB_REF_NAME#v}_${name}.${ext}"
            if [ "${ext}" = "zip" ]; then
              (cd stage && zip -qr "../${archive}" .)
            else
              tar czf "${archive}" -C stage .
            fi
          done

      # Top-level checksum file covering all archives (design D4).
      - name: Generate checksums
        run: |
          set -euo pipefail
          (cd dist && sha256sum synopsis_*.tar.gz synopsis_*.zip > SHA256SUMS.txt)

      # Publish via the Gitea-compatible fork of the GitHub release action
      # (design D2). The body is deliberately empty (manual release); the
      # name defaults to the tag. A dash-suffixed tag (vX.Y.Z-rc*) is a
      # prerelease. NODE_OPTIONS covers runners with Node < 18, where
      # fetch is not built in; it is a harmless no-op on newer Node.
      - name: Publish release
        uses: akkuman/gitea-release-action@v1
        env:
          NODE_OPTIONS: '--experimental-fetch'
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/synopsis_*.tar.gz
            dist/synopsis_*.zip
            dist/SHA256SUMS.txt
          prerelease: ${{ contains(github.ref_name, '-') }}
