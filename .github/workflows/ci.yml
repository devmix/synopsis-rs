# CI Pipeline — quality gates for the Rust workspace, in a single
# sequential job (change rebuild-github-cicd-flow, design D1). The old
# two-job layout ran checkout, toolchain install, and cache restore
# twice and compiled the workspace on two parallel runners; the merged
# job does each exactly once — the workspace is compiled per profile
# (clippy metadata, test codegen, llvm-cov instrumented) exactly once
# each. Coverage stays measure-first, no gates (change
# coverage-rust-workspace): the coverage step and its artifact upload
# carry continue-on-error, so a coverage failure must not block the
# core gate — merging the jobs would otherwise silently change that
# semantic (design D2). The 5-target cross-build + packaging now
# happens in release.yml at tag time.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checkout only needs to read the repository.
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Checks + Coverage — fmt, clippy, and the test suite, followed by
  # the cargo-llvm-cov measurement, all on one runner: they share a
  # single checkout, toolchain install, and cargo cache, so the
  # workspace is compiled per profile exactly once instead of on two
  # parallel runners (design D1). Wall time grows (serial instead of
  # parallel) — accepted; runner usage halves.
  # ------------------------------------------------------------------
  ci:
    name: Checks + Coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The toolchain is pinned in rust-toolchain.toml (channel 1.96.0).
      # The @rev of this action must match that file exactly: rustup
      # resolves the directory override from the file, and a mismatching
      # install would make every cargo command fail with "toolchain not
      # installed". The action installs with --profile minimal, so
      # clippy and rustfmt have to be requested explicitly;
      # llvm-tools-preview provides the LLVM coverage tooling that
      # cargo-llvm-cov drives.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt, llvm-tools-preview

      # Caches ~/.cargo (registry, git deps) and ./target; keyed by the
      # installed rustc version, so it must run after the toolchain step.
      # shared-key: host pins a stable slot that does not embed the job name
      # (design D8): the action's default key is v0-rust-{job}-{OS}-{envHash},
      # so the checks→ci job rename would have invalidated every saved cache.
      # The release gate job (release.yml) restores/saves the same slot, so
      # the frequent push runs keep the rare tag runs warm.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: host

      # Gate 1 — formatting. Fails on any unformatted file in any member.
      - name: Check formatting
        run: cargo fmt --check

      # Gate 2 — lints. -D warnings promotes every warn-level lint (the
      # workspace baseline from task 1.1 included) to a hard error.
      - name: Lint with clippy
        run: cargo clippy --all-targets -- -D warnings

      # Gate 3 — tests across all workspace members.
      - name: Run tests
        run: cargo test

      # Install cargo-llvm-cov v0.9.0 (pinned) from prebuilt GitHub
      # release binaries. Dev-only tool: the binary lands in CARGO_HOME
      # and never enters Cargo.toml/Cargo.lock (frozen stack).
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0

      # Measure workspace line coverage and write the lcov trace file.
      # cargo-llvm-cov builds in its own target/llvm-cov-target
      # directory, so it neither pollutes nor reuses ./target — no
      # cache interference with the test step above. continue-on-error
      # keeps coverage measure-first: a failure here must not block the
      # core gate (design D2). There is deliberately no coverage
      # threshold flag (gating is deferred).
      - name: Measure coverage
        if: always()
        continue-on-error: true
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      # Keep the lcov trace as a run artifact for inspection.
      # continue-on-error so the upload still runs after a failed or
      # skipped measurement (if: always() overrides the default
      # skip-on-earlier-failure behavior).
      - name: Upload lcov artifact
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
