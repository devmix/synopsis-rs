# CI Pipeline — quality gates for the Rust workspace. Two independent jobs
# run in parallel: `checks` is fmt + clippy + test on Linux x64 (task 2.1) —
# the native build check, since the test gate compiles and links the whole
# workspace; `coverage` measures workspace line coverage with cargo-llvm-cov
# and uploads an lcov artifact (change coverage-rust-workspace, task 1.1) —
# measure-first, no gates. The 5-target cross-build + packaging now happens
# in `release.yml` at tag time ("Keeping
# dev runs fast"); see the rebuild-ci-cd change (design D1).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Checkout only needs to read the repository.
permissions:
  contents: read

jobs:
  # ------------------------------------------------------------------
  # Checks — fmt, clippy and the test suite on Linux x64. One job runs
  # all three gates sequentially: they share a single toolchain install
  # and cargo cache, so splitting them would add runner time without
  # saving any at this stage of the project.
  # ------------------------------------------------------------------
  checks:
    name: Checks (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The toolchain is pinned in rust-toolchain.toml (channel 1.96.0).
      # The @rev of this action must match that file exactly: rustup
      # resolves the directory override from the file, and a mismatching
      # install would make every cargo command fail with "toolchain not
      # installed". The action installs with --profile minimal, so
      # clippy and rustfmt have to be requested explicitly.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      # Caches ~/.cargo (registry, git deps) and ./target; keyed by the
      # installed rustc version, so it must run after the toolchain step.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Gate 1 — formatting. Fails on any unformatted file in any member.
      - name: Check formatting
        run: cargo fmt --check

      # Gate 2 — lints. -D warnings promotes every warn-level lint (the
      # workspace baseline from task 1.1 included) to a hard error.
      - name: Lint with clippy
        run: cargo clippy --all-targets -- -D warnings

      # Gate 3 — tests across all workspace members.
      - name: Run tests
        run: cargo test

  # ------------------------------------------------------------------
  # Coverage — workspace line-coverage measurement via cargo-llvm-cov
  # (change coverage-rust-workspace, task 1.1). Runs in parallel to
  # `checks` (no `needs:`): coverage is measure-first,
  # so a coverage failure must not block the core gate. The lcov trace
  # file is kept as a run artifact; there is deliberately no
  # --fail-under-* flag (gating is deferred to Phase 3).
  # ------------------------------------------------------------------
  coverage:
    name: Coverage (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Same pinned toolchain as the other jobs (rust-toolchain.toml,
      # 1.96.0); llvm-tools-preview provides the LLVM coverage tooling
      # that cargo-llvm-cov drives.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: llvm-tools-preview

      # Caches ~/.cargo (registry, git deps) and ./target; keyed by the
      # installed rustc version, so it must run after the toolchain step
      # — same rule as in the other jobs.
      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      # Install cargo-llvm-cov v0.9.0 (pinned, per design D1) from
      # prebuilt GitHub release binaries. Dev-only tool: the binary
      # lands in CARGO_HOME and never enters Cargo.toml/Cargo.lock
      # (frozen stack).
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.0

      # Measure workspace line coverage and write the lcov trace file.
      - name: Measure coverage
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      # Keep the lcov trace as a run artifact for inspection. The step
      # uses the Gitea-compatible fork of the standard upload-artifact
      # action: the standard action aborts on the self-hosted Gitea
      # runner (no artifact service).
      - name: Upload lcov artifact
        uses: ChristopherHX/gitea-upload-artifact@v4
        with:
          name: coverage-lcov
          path: lcov.info
