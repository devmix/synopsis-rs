[profile.release]
opt-level = 3        # Optimize for size "z" (or "s" for aggressive size optimization)
lto = "thin"         # Enable Link-Time Optimization (removes dead code across dependencies)
codegen-units = 1    # Reduces parallel generation; maximizes LTO optimization
panic = "abort"      # Strips unwinding code, panic messages, and dependency landing pads
strip = true         # Automatically strips all debug symbols and local path information

[profile.dev]
debug = "full"
split-debuginfo = "unpacked" # Keeps debug symbols in separate files instead of bundling them into the binary

[profile.dev.package."*"]
opt-level = 2 # Forces all dependencies (crates.io) to compile with optimizations. Since you rarely debug external libraries, this prevents them from generating huge debug files.
debug = false

[workspace]
# Edition 2024 default resolver (requires Rust >= 1.85).
resolver = "3"
members = [
    "crates/config",
    "crates/db",
    "crates/vectors",
    "crates/utils",
    "crates/llm",
    "crates/embedding",
    "crates/ingestion",
    "crates/graph",
    "crates/search",
    "crates/mcp",
    "crates/cli",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

# Workspace lint baseline (task 1.1, revision 1). Every crate opts in via
# `lints.workspace = true`; the clippy gate runs with `-D warnings`, so warn
# and deny both fail the build here.
[workspace.lints.rust]
missing_docs = "deny" # public API must be documented; fails compilation otherwise
unsafe_code = "forbid" # frozen stack has no unsafe requirements; relax per-crate if native-seam work needs it

[workspace.lints.clippy]
all = { level = "warn", priority = -1 } # make the default clippy baseline explicit
unwrap_used = "warn" # test code may opt out locally: `#![allow(clippy::unwrap_used)]` on the test module
expect_used = "warn" # same as unwrap_used

# Shared dependency palette (frozen stack: openspec/config.yaml). Members inherit
# entries via `name = { workspace = true }`. Versions verified on crates.io
# 2026-08-18; unused entries stay out of the resolve graph until inherited.
[workspace.dependencies]
# Internal crates - dependency graph fixed by design.md D1 (revised by
# db-module task 1.18, human decision 2026-08-20: db → config for the
# SQLite batch-size constants; llm change D1 adds llm to the base tier;
# utils-crate D1 adds utils as a leaf any crate may depend on):
# config, db, vectors, utils, llm -> embedding, ingestion, graph -> search -> mcp -> cli
config = { path = "crates/config" }
db = { path = "crates/db" }
vectors = { path = "crates/vectors" }
utils = { path = "crates/utils" }
# Base tier (llm change D1): OpenAI-compatible LLM client; only internal
# dependency is config (LlmConfig). graph/embedding depend on it, never
# the other way around.
llm = { path = "crates/llm" }
embedding = { path = "crates/embedding" }
ingestion = { path = "crates/ingestion" }
graph = { path = "crates/graph" }
search = { path = "crates/search" }
mcp = { path = "crates/mcp" }

# Async runtime and HTTP/SSE transport (design D2)
tokio = { version = "1", features = ["full"] } # 1.53.x is current stable
axum = "0.8" # latest stable line; 0.9 not yet released on crates.io
# Legacy SSE transport (add-legacy-sse-transport, design D3): all three are
# already in the lock graph — rmcp 3.1.3 pulls sse-stream 0.2.5 and
# tokio-stream 0.1.19, and uuid 1.24.1 is shared with cel/r2d2_sqlite/rmcp —
# so promoting them to direct workspace deps adds NO new package to
# Cargo.lock (verified with `cargo tree -i`). sse-stream serializes the SSE
# frames, tokio-stream adapts the mpsc receiver to the axum body stream, and
# uuid (v4) mints the server-generated session ids.
sse-stream = "0.2"
tokio-stream = "0.1"
uuid = { version = "1", features = ["v4"] }

# MCP protocol: official SDK (modelcontextprotocol/rust-sdk), decision design D8
# (2026-08-18): Streamable HTTP transport, wire compatibility with the legacy
# SSE transport deliberately NOT preserved. 3.1.3 is current (verified on crates.io).
rmcp = "3"
# Plain-HTTP client for the mcp integration test (task 5.10): the GET /health
# assertion. reqwest 0.13.4 is already in the lock graph (rmcp 3.1.3's
# Streamable HTTP client transport depends on it) — inheriting it adds no new
# crate version to the build. Default features off at the palette level
# (workspace-inheritance rule: a member cannot flip them): a plain http://
# loopback assertion needs no TLS provider, keeping the stack pure-Rust
# (no native-tls/OpenSSL); the mcp dev-dep adds `json`.
reqwest = { version = "0.13", default-features = false }

# SQLite storage, FTS5 compiled in (design D3). As of rusqlite 0.40 / libsqlite3-sys
# 0.38 the defaults inverted: plain default links a system SQLite via pkg-config, and
# source-compiled bundling is an opt-in `bundled` feature of libsqlite3-sys itself —
# cargo forbids enabling it transitively through rusqlite (no re-exported feature), so
# we depend on libsqlite3-sys directly to force the bundled build; standard extensions
# incl. FTS5 ship in every bundled build, there is no separate `fts5` feature anymore
# (verified against the crates.io index, 2026-08-18). No CGO flags anywhere.
rusqlite = "0.40"
libsqlite3-sys = { version = "0.38", features = ["bundled"] }

# Knowledge graph (graph change, design D1/D2; feasibility gate task 1.1,
# 2026-08-22). Verified against the crates.io index: petgraph 0.8.3 (MIT OR
# Apache-2.0, rust-version 1.64) is pure Rust with zero native dependencies;
# default features trimmed to `std` only (graphmap/stable_graph/matrix_graph
# are unused by design D1 — the index is a plain DiGraph). cel 0.14.3 (MIT,
# rust-version 1.86.0) is active (published 2026-08-15) and replaces the
# stale cel-interpreter per the frozen-stack decision of 2026-08-22 (design
# D2); default features kept: `regex` (CEL regex functions) and `chrono`
# (timestamp values — pure Rust; on darwin it reaches core-foundation-sys,
# covered by the vendored ci/darwin-sdk stub). Both MSRVs are below our
# pinned Rust 1.96.0; the zigbuild gate for both targets passed in task 1.1.
petgraph = { version = "0.8", default-features = false, features = ["std"] }
cel = "0.14"
# Prompt template engine (llm change, design D3; human decision 2026-08-23):
# the entity-linker prompts are user-overridable data with context loops and
# join/truncate helpers, so a real template engine replaces the legacy
# text/template. Verified against the crates.io index: minijinja 2.24.0 is the
# current stable 2.x line (3.0.0 is still alpha); MSRV 1.70, no known CVEs,
# well below our pinned Rust 1.96.0. Default features trimmed to what the
# linker needs: `serde` (render our input structs into a `Value`) and
# `std_collections` (Vec/String in the context) — the builtins/macros/debug/
# multi_template extras are unused and would bloat the single-binary build.
minijinja = { version = "2", default-features = false, features = ["serde", "std_collections"] }
# cel-interpreter was superseded by `cel` above (graph design D2, 2026-08-22);
# it is no longer inherited by any member and is kept here only as a palette
# record of the former pin (remove once the palette is tidied).
cel-interpreter = "0.10"
notify = "8"
indicatif = "0.18"

# CLI parsing (cli change, design D1; user-approved stack extension 2026-08-27,
# recorded in openspec/config.yaml): clap 4.6.6 Builder API for full control
# over flag/help structure. Help text is Rust-idiomatic — deliberately NOT
# byte-matched to the legacy CLI's help text (user decision 2026-08-27).
clap = "4.6.6"
# Structured logging in the cli binary only (cli change, design D2; user-approved
# 2026-08-27): library crates stay logger-less. Both are already in the lock
# graph (verified 2026-08-27: tracing 0.1.44 / tracing-subscriber 0.3.23 are the
# current pins); `env-filter` honors RUST_LOG, `json` is the legacy
# implementation's other log format (design D2).
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

# Serialization and config (config crate)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noyalib = "0.0.23" # YAML: successor of serde_yaml/serde_yml, both deprecated (verified 2026-08-18)

# Cursor pagination for the MCP catalog tools (mcp-server task 5.2): opaque
# base64 cursors, byte-compatible with the recorded wire format.
# Verified on crates.io 2026-08-26: base64 0.23.1 is current
# (published 2026-08-04), pure Rust with zero dependencies, MSRV 1.48 <
# pinned Rust 1.96.0, no known CVEs.
base64 = "0.23"

# Schema migrations (db-module D3, ADR 0001): rusqlite_migration with the
# from-directory loader + include_dir embedding the repo-root `migrations/` tree at
# compile time. PRAGMA user_version is the sole schema-state authority (no
# _schema_migrations table). Versions verified online by the implementer (task
# db-module 1.1, 2026-08-19): rusqlite_migration 2.6.0 is the current release and its
# 2.6.0 release notes update the rusqlite peer to 0.40 (matching the palette pin);
# MSRV tracks rusqlite's (latest stable at release, compiles under our pinned Rust
# 1.96.0); include_dir 0.7.4 is the current 0.7.x (MIT, stable since 2024); no known
# CVEs for either. The exact pin pair was proven against the pinned toolchain in spike
# S1 (.archive/spikes, cargo.lock entries 2.6.0 / 0.7.4).
rusqlite_migration = { version = "2.6", features = ["from-directory"] }
include_dir = "0.7"

# Connection pool for the sync SQLite driver (db-module D1, re-decided
# 2026-08-20: read-heavy workload, WAL + concurrent readers). Versions verified
# online by the implementer (task db-module 1.9, 2026-08-20): r2d2 0.8.10 is the
# current release (MIT/Apache-2.0, edition 2018, MSRV far below our pinned Rust
# 1.96.0, no known CVEs); its `ManageConnection` bounds the connection type as
# `Send + 'static` only — deliberately NO `Sync` — which matches rusqlite's
# `Connection` (Send, not Sync) exactly. r2d2_sqlite 0.35.0 is the current
# release (2026-07-06, MIT, edition 2018, peer rusqlite ^0.40 matching the
# palette pin, no known CVEs); it provides the per-connection init callback
# (D8 PRAGMAs) and the shared-cache in-memory manager (D12).
r2d2 = "0.8"
r2d2_sqlite = "0.35"

# Error types for library crates (config-module D4). Version verified online by the
# implementer against crates.io, MSRV and CVEs (task config-module 1.1): thiserror 2.x is
# current stable; locked at 2.0.20 in Cargo.lock; MSRV below our pinned Rust 1.96.0.
thiserror = "2"

# Regex engine for extraction-rule patterns compiled at config load time (config-module D5).
# Version verified online by the implementer against crates.io, MSRV and CVEs (task
# config-module 3.1b): regex 1.13.x is current stable (official rust-lang crate); no known
# CVEs; resolves below our pinned Rust 1.96.0 toolchain.
regex = "1"
# gitignore-style file matching for source walks (ingestion task 1.2b, human
# decision 2026-08-23: exclusions exclusively via `.synignore`, no built-in
# skip list). Verified against the crates.io index + registry source (task
# 1.2b): ignore 0.4.33 is the current 0.4.x (BurntSushi/ripgrep crate),
# rust-version 1.88 < pinned Rust 1.96.0, no features needed (the only feature,
# `simd-accel`, is an optional regex-automata accelerator we do not enable).
# crossbeam-channel/crossbeam-deque are hard (non-optional) dependencies of the
# crate used by its parallel walk API — unavoidable, but pure Rust, so no
# impact on the single-binary/laptop constraints. No known CVEs.
ignore = "0.4"
# HTML -> Markdown for the webpage source (ingestion task 1.8): the Rust
# analogue of the legacy HTML-to-Markdown dependency — built on html5ever
# (Servo's fault-tolerant HTML5 parser, pure Rust, the Rust counterpart of
# golang.org/x/net/html), with structural Markdown output (ATX
# headings, links, lists, tables, code, images) that the markdown chunker
# relies on for structure-aware splitting. Verified against the crates.io
# index + docs.rs (task 1.8): html-to-markdown-rs 3.11.4 (xberg-io, MIT),
# active (released 2026-08-22, ~1M downloads), rust-version 1.88 < pinned
# Rust 1.96.0, no known CVEs. Default features trimmed: `metadata` (serde /
# serde_json metadata extraction) is unused — plain conversion only.
html-to-markdown-rs = { version = "3.11", default-features = false }

# ONNX embeddings pipeline (embedding change, design D1/D2/D3/D8; ADR 0002). Versions
# verified online by the implementer against crates.io, MSRV and CVEs (task embedding 1.1,
# 2026-08-20); no known CVEs for the locked versions; all MSRVs below our pinned Rust 1.96.0.
#
# ort 2.0.0-rc.13 (published 2026-07-28, MIT/Apache-2.0, MSRV 1.88): default features OFF —
# the default set enables download-binaries, which the frozen stack forbids (the runtime
# .so/.dylib is downloaded per onnx.yaml and loaded from an explicit path via
# ort::init_from, design D1/D10); load-dynamic pulls only std + libloading. The pre-release
# pin is a conscious decision (ADR 0002); all ort API churn is isolated in runtime.rs.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
# tokenizers 0.23.1 (HuggingFace, Apache-2.0): tokenizer.json loading for bge-m3 (design
# D2); default features (progressbar/onig/esaxx_fast) kept as published.
tokenizers = "0.23.1"
# ureq 3.4.0 (MSRV 1.85): sync HTTP for the runtime/model downloader (design D8); default
# rustls+gzip keeps TLS pure-Rust, which matters for the static musl and windows-gnu CI
# targets (no system OpenSSL).
ureq = "3"
# sha2 0.11.0 (MSRV 1.85): cache keys sha256(model|dim|text) (design D3).
sha2 = "0.11"
# zip 8.6.0 (MSRV 1.88): ONNX Runtime .zip packages (design D8); deflate-only — ONNX
# releases use plain deflate, and the default feature set would add zstd/bzip2 C
# dependencies for no benefit.
zip = { version = "8", default-features = false, features = ["deflate"] }
# flate2 1.1.9 (MSRV 1.67): gzip for .tar.gz runtime packages (design D8); default
# pure-Rust miniz_oxide backend (cross-compile friendly).
flate2 = "1"
# tar 0.4.46 (MSRV 1.63): .tar.gz runtime packages (design D8).
tar = "0.4"

# ANN engine (add-usearch-ann-engine, task 1.1 spike, 2026-08-29):
# usearch 2.26.1 - C++11 single-file HNSW core compiled in-tree via cxx FFI
# (its only build deps are cxx + cxx-build - no datafusion/arrow/parquet).
# Verified on crates.io: 2.26.1 is the latest 2.x (published 2026-08-22,
# ~980k downloads, Apache-2.0). Default features OFF: the `numkong`
# SIMD-kernel crate is optional and the vendored C++ core ships its own
# distance kernels, so it stays out of the graph (single binary, laptop
# footprint). Disk-backed serving via `Index::restore_view` (mmap).
usearch = { version = "2.26", default-features = false }
# cxx FFI glue for usearch: the Rust bindings surface `cxx::Exception` error
# types, so vectors depends on cxx directly to map them into VectorsError.
cxx = "1"

# Intentionally NOT pinned here - decisions deferred to module changes:
# - Spike-only pins (ort/tokenizers) were removed from this palette in task 5.1; they
#   come back per module change: rusqlite_migration + include_dir with db-module
#   (task 1.1, ADR 0001), ort + tokenizers with the embedding change (task 1.1, ADR
#   0002), usearch + cxx with the vectors change (task 1.1, ADR 0004 - pins above).
# MCP protocol crate: decision made 2026-08-18 -> rmcp 3.x above (design D8).

# Date/time engine (utils-crate change, design D2; human directive 2026-08-25:
# ready-made date/time libraries everywhere). jiff 0.2.x (BurntSushi,
# MIT OR Apache-2.0): verified on crates.io 2026-08-26 — 0.2.35 is current
# (published 2026-07-25), pure Rust with zero native dependencies, MSRV well
# below our pinned Rust 1.96.0, no known CVEs. This dependency is
# default-features OFF, features = ["std"] only: everything is UTC, so the
# tz-system/tzdb features (IANA timezone machinery + windows-link) are never
# requested here. Precise note (verified via cargo tree, utils-crate task 1.2):
# `std` itself pulls no tz machinery; the only tz-data crate in jiff's default
# feature set, jiff-tzdb-platform (~10 KB), is target-gated to Windows/wasm —
# never built on the Linux/macOS targets and never accessed by this UTC-only
# code.
jiff = { version = "0.2", default-features = false, features = ["std"] }
