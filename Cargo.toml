[workspace]
# Edition 2024 default resolver (requires Rust >= 1.85).
resolver = "3"
members = [
    "crates/config",
    "crates/db",
    "crates/vectors",
    "crates/embedding",
    "crates/ingestion",
    "crates/graph",
    "crates/search",
    "crates/mcp",
    "crates/cli",
    # Dev-tooling (design D6): not part of the product dependency graph.
    "crates/parity-harness",
]

[workspace.package]
edition = "2024"
version = "0.1.0"

# Workspace lint baseline (task 1.1, revision 1). Every crate opts in via
# `lints.workspace = true`; the clippy gate runs with `-D warnings`, so warn
# and deny both fail the build here.
[workspace.lints.rust]
missing_docs = "deny" # public API must be documented; fails compilation otherwise
unsafe_code = "forbid" # frozen stack has no unsafe requirements; relax per-crate if native-seam work needs it

[workspace.lints.clippy]
all = { level = "warn", priority = -1 } # make the default clippy baseline explicit
unwrap_used = "warn" # test code may opt out locally: `#![allow(clippy::unwrap_used)]` on the test module
expect_used = "warn" # same as unwrap_used

# Shared dependency palette (frozen stack: openspec/config.yaml). Members inherit
# entries via `name = { workspace = true }`. Versions verified on crates.io
# 2026-08-18; unused entries stay out of the resolve graph until inherited.
[workspace.dependencies]
# Internal crates - dependency graph fixed by design.md D1 (revised by
# db-module task 1.18, human decision 2026-08-20: db → config for the
# SQLite batch-size constants):
# config -> db; db, vectors -> embedding, ingestion, graph -> search -> mcp -> cli
config = { path = "crates/config" }
db = { path = "crates/db" }
vectors = { path = "crates/vectors" }
embedding = { path = "crates/embedding" }
ingestion = { path = "crates/ingestion" }
graph = { path = "crates/graph" }
search = { path = "crates/search" }
mcp = { path = "crates/mcp" }

# Async runtime and HTTP/SSE transport (design D2)
tokio = { version = "1", features = ["full"] } # 1.53.x is current stable
axum = "0.8" # latest stable line; 0.9 not yet released on crates.io

# MCP protocol: official SDK (modelcontextprotocol/rust-sdk), decision design D8
# (2026-08-18): Streamable HTTP transport, wire compatibility with the Go oracle's
# legacy SSE deliberately NOT preserved. 3.1.3 is current (verified on crates.io).
rmcp = "3"

# SQLite storage, FTS5 compiled in (design D3). As of rusqlite 0.40 / libsqlite3-sys
# 0.38 the defaults inverted: plain default links a system SQLite via pkg-config, and
# source-compiled bundling is an opt-in `bundled` feature of libsqlite3-sys itself —
# cargo forbids enabling it transitively through rusqlite (no re-exported feature), so
# we depend on libsqlite3-sys directly to force the bundled build; standard extensions
# incl. FTS5 ship in every bundled build, there is no separate `fts5` feature anymore
# (verified against the crates.io index, 2026-08-18). No CGO flags anywhere.
rusqlite = "0.40"
libsqlite3-sys = { version = "0.38", features = ["bundled"] }

# CEL expressions for entity linking (graph crate), file watcher,
# cron scheduling and progress bars
cel-interpreter = "0.10"
notify = "8"
tokio-cron-scheduler = "0.15"
indicatif = "0.18"

# Serialization and config (config crate)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
noyalib = "0.0.23" # YAML: successor of serde_yaml/serde_yml, both deprecated (verified 2026-08-18)

# Schema migrations (db-module D3, ADR 0001): rusqlite_migration with the
# from-directory loader + include_dir embedding the repo-root `migrations/` tree at
# compile time. PRAGMA user_version is the sole schema-state authority (no
# _schema_migrations table). Versions verified online by the implementer (task
# db-module 1.1, 2026-08-19): rusqlite_migration 2.6.0 is the current release and its
# 2.6.0 release notes update the rusqlite peer to 0.40 (matching the palette pin);
# MSRV tracks rusqlite's (latest stable at release, compiles under our pinned Rust
# 1.96.0); include_dir 0.7.4 is the current 0.7.x (MIT, stable since 2024); no known
# CVEs for either. The exact pin pair was proven against the pinned toolchain in spike
# S1 (.archive/spikes, cargo.lock entries 2.6.0 / 0.7.4).
rusqlite_migration = { version = "2.6", features = ["from-directory"] }
include_dir = "0.7"

# Connection pool for the sync SQLite driver (db-module D1, re-decided
# 2026-08-20: read-heavy workload, WAL + concurrent readers). Versions verified
# online by the implementer (task db-module 1.9, 2026-08-20): r2d2 0.8.10 is the
# current release (MIT/Apache-2.0, edition 2018, MSRV far below our pinned Rust
# 1.96.0, no known CVEs); its `ManageConnection` bounds the connection type as
# `Send + 'static` only — deliberately NO `Sync` — which matches rusqlite's
# `Connection` (Send, not Sync) exactly. r2d2_sqlite 0.35.0 is the current
# release (2026-07-06, MIT, edition 2018, peer rusqlite ^0.40 matching the
# palette pin, no known CVEs); it provides the per-connection init callback
# (D8 PRAGMAs) and the shared-cache in-memory manager (D12).
r2d2 = "0.8"
r2d2_sqlite = "0.35"

# Error types for library crates (config-module D4). Version verified online by the
# implementer against crates.io, MSRV and CVEs (task config-module 1.1): thiserror 2.x is
# current stable; locked at 2.0.20 in Cargo.lock; MSRV below our pinned Rust 1.96.0.
thiserror = "2"

# Regex engine for extraction-rule patterns compiled at config load time (config-module D5).
# Version verified online by the implementer against crates.io, MSRV and CVEs (task
# config-module 3.1b): regex 1.13.x is current stable (official rust-lang crate); no known
# CVEs; resolves below our pinned Rust 1.96.0 toolchain.
regex = "1"

# ONNX embeddings pipeline (embedding change, design D1/D2/D3/D8; ADR 0002). Versions
# verified online by the implementer against crates.io, MSRV and CVEs (task embedding 1.1,
# 2026-08-20); no known CVEs for the locked versions; all MSRVs below our pinned Rust 1.96.0.
#
# ort 2.0.0-rc.13 (published 2026-07-28, MIT/Apache-2.0, MSRV 1.88): default features OFF —
# the default set enables download-binaries, which the frozen stack forbids (the runtime
# .so/.dylib is downloaded per onnx.yaml and loaded from an explicit path via
# ort::init_from, design D1/D10); load-dynamic pulls only std + libloading. The pre-release
# pin is a conscious decision (ADR 0002); all ort API churn is isolated in runtime.rs.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["load-dynamic"] }
# tokenizers 0.23.1 (HuggingFace, Apache-2.0): tokenizer.json loading for bge-m3 (design
# D2); default features (progressbar/onig/esaxx_fast) kept as published.
tokenizers = "0.23.1"
# ureq 3.4.0 (MSRV 1.85): sync HTTP for the runtime/model downloader (design D8); default
# rustls+gzip keeps TLS pure-Rust, which matters for the static musl and windows-gnu CI
# targets (no system OpenSSL).
ureq = "3"
# sha2 0.11.0 (MSRV 1.85): cache keys sha256(model|dim|text) (design D3).
sha2 = "0.11"
# zip 8.6.0 (MSRV 1.88): ONNX Runtime .zip packages (design D8); deflate-only — ONNX
# releases use plain deflate, and the default feature set would add zstd/bzip2 C
# dependencies for no benefit.
zip = { version = "8", default-features = false, features = ["deflate"] }
# flate2 1.1.9 (MSRV 1.67): gzip for .tar.gz runtime packages (design D8); default
# pure-Rust miniz_oxide backend (cross-compile friendly).
flate2 = "1"
# tar 0.4.46 (MSRV 1.63): .tar.gz runtime packages (design D8).
tar = "0.4"

# ANN engine (vectors change, design D5; ADR 0003): lancedb 0.37.1 / lance 10.0.0.
# Verified against registry source (task vectors 1.1, 2026-08-21): lancedb 0.37.1 has
# `default = []`, so local-filesystem storage needs NO features at all - the cloud
# object-store features (aws/azure/gcp/oss/huggingface/remote) are all opt-in and are
# deliberately excluded (single local binary, no cloud). MSRV 1.91.0 (lancedb/lance),
# datafusion 1.88 / arrow 1.85 - all below our pinned Rust 1.96.0.
lancedb = { version = "0.37", default-features = false }
# Stream consumption for the vectors engine (vectors task 1.3): LanceDB query
# results are `futures`-based streams. Re-introduces the spike-only pin removed
# in scaffold task 5.1 ("they come back per module change"); already in the
# lock graph via lancedb (0.3.34 locked), so no new code is compiled.
futures = "0.3"

# Intentionally NOT pinned here - decisions deferred to module changes:
# - Spike-only pins (ort/tokenizers/lancedb/futures) were removed from this palette in task
#   5.1; they come back per module change: rusqlite_migration + include_dir with db-module
#   (task 1.1, ADR 0001), ort + tokenizers with the embedding change (task 1.1, ADR 0002),
#   lancedb with the vectors change (task 1.1, ADR 0003 - pin above).
# MCP protocol crate: decision made 2026-08-18 -> rmcp 3.x above (design D8).
