schema: spec-driven

# ─────────────────────────────────────────────────────────────────────
# Project context — показано AI при создании артефактов
# ─────────────────────────────────────────────────────────────────────
context: |
  ## Проект
  Synopsis (Rust) — переписанная на Rust версия Go-сервиса "Synopsis": локальный
  RAG + knowledge-graph MCP-сервер для личного использования. Go-оригинал живёт в
  соседнем репозитории ../synopsis и является ОРАКУЛОМ/референс-реализацией на всё
  время миграции: его тесты, поведение и контракты — источник истины для паритета.

  ## Целевой стек (заморожен)
  - Rust + tokio (async runtime) + axum (HTTP для не-MCP эндпоинтов, напр. /health)
  - rusqlite (bundled + fts5) — SQLite-хранилище; FTS5 всегда доступен, без cgo-флагов.
    Миграции: rusqlite_migration 2.x (from-directory), PRAGMA user_version — единственный
    источник истины о состоянии схемы; _schema_migrations не создаётся (решения 2026-08-18)
  - ort (ONNX Runtime, внешний .so/.dylib) — эмбеддинги (bge-m3 int8, 1024-dim) и NER;
    рантайм скачивается в data/ по onnx.yaml (механизм переносится из Go оригинала).
    Биндинги-крейт отложен: финальный пин — в change `embedding` (ADR 0002)
  - usearch 2.x (C++11 HNSW core via cxx, disk-backed, scalar-quantized default bf16,
    WAL + segments per ADR 0004) — the sole ANN engine, replaces vec0 brute-force.
    Векторы НЕ читаются из старого vec0: пересобираются по тексту чанков
  - rmcp 3.x — MCP протокол (Streamable HTTP (design D8) + legacy HTTP+SSE оракула
    (override D8, решение человека 2026-08-31, change `add-legacy-sse-transport`,
    wire-контракт mcp-go v0.57.0)); cel-interpreter — выражения линковки сущностей;
    tokenizers, notify, indicatif
  - tokio-cron-scheduler — был в стеке, удалён в change `document-jobs-queue` (задача
    1.9): standalone orphan-cleanup scheduler заменён GC внутри worker'а; зависимость
    стала сиротской и убрана из workspace + cli Cargo.toml и Cargo.lock.
  - clap 4.6.6 (Builder API) — парсинг CLI-флагов и подкоманд (change `cli`,
    user-approved расширение стека 2026-08-27; help-текст НЕ байт-паритетен с Go —
    функциональная копия, не кодовая)
  - tracing 0.1.44 + tracing-subscriber 0.3.23 — структурированные логи в `cli`
    (serve/sync/load-test); библиотеки остаются logger-less (user-approved расширение
    стека 2026-08-27)

  ## Жёсткие ограничения
  - Цель: ноутбук (16 ГБ RAM), личное использование, НЕ сервер. При N=1M × 1024-dim
    full-precision векторы (~4 ГБ) в RAM не помещаются → индекс должен быть
    disk-backed/mmap + квантованный граф. Запросный путь не грузит модель эмбеддингов.
  - Один локальный бинарь, без внешних сервисов.
  - Rust строит свою БД с нуля: один squashed init-миграция; legacy Go-созданный
    knowledge.db НЕ открывается, НЕ апгрейдится, данные НЕ мигрируются (решения
    2026-08-18, design D6). Схема из 5 миграций Go оригинала — структурный контракт
    (финальная форма v5).

  ## Модель исполнения (ВАЖНО для декомпозиции задач)
  - Реализацию пишет ИИ; человек отвечает только за ревью процесса и контрактов.
  - Оркестратор запускает РАЗНЫХ агентов на разных этапах/задачах: каждый агент
    стартует БЕЗ памяти предыдущих сессий. Бюджет контекста агента ~100k токенов —
    задача должна полностью помещаться в него (тело + код модуля + тесты + орракул-референсы).
  - Паритет проверяется МАШИНОЙ: differential-тесты против Go-бинаря на общих фикстурах,
    recall@k + p50/p95 гейты для ANN. Человек ревьюит контракты и отклонения, не строки кода.

  ## Принципы миграции (решения человека, 2026-08-18)
  - НЕ копировать Go-оригинал 1:1. Оракул — референс по ПОВЕДЕНИЮ и КОНТРАКТАМ, а не
    чертёж для транскрипции. Каждый портируемый кусок перепроектируется архитектурно для
    Rust: ошибки оригинала не повторяются; если в Go код неверен или Rust позволяет более
    оптимальное/эффективное решение — делать его, ДАЖЕ ценой потери совместимости с оракулом
    (изменение контрактов — отдельное явное решение по правилам ниже).
  - Перед выбором любой библиотеки/фреймворка — проверять в интернете наиболее подходящие
    кандидаты под задачу (в Rust другие движки шаблонов, HTTP-клиенты, сериализация и т.п.),
    а не переносить стек Go механически. Сверять версии, MSRV, статус поддержки и CVE по
    официальным источникам.

# ─────────────────────────────────────────────────────────────────────
# Правила по артефактам
# ─────────────────────────────────────────────────────────────────────
rules:
  proposal:
    - Ограничивай scope одним модулем или одной фазой миграции
    - Всегда указывай, какие замороженные контракты (MCP tools / CLI / data schema / config) затрагиваются и как подтверждается паритет
    - Обязательно секция "Non-goals"

  design:
    - Каждое решение — с причиной (почему не альтернатива)
    - Изменение замороженного контракта оформляется отдельным решением с явным обоснованием
    - Указывай, какие файлы Go-оригинала (../synopsis/internal/...) являются референсом для данного дизайна

  specs:
    - Контрактные спеки (mcp-contract, cli-surface, data-schema, config-format) фиксируют поведение Go оригинала как есть; источники истины — ../synopsis/internal/mcp/tools.go, cmd/app/*, migrations/*.sql, configs/*.yaml, data/ontology/*.xml
    - Требования формулируются через сценарии (Given/When/Then), проверяемые тестами

  tasks:
    - ДЕКОМПОЗИЦИЯ ПОД КОНТЕКСТ АГЕНТА — каждая задача выполняется свежим агентом без памяти предыдущих задач. Тело задачи должно быть самодостаточным при бюджете ~100k токенов, а именно — цель, точный scope файлов, зависимости (какие задачи/модули должны уже существовать), критерии приёмки, путь к референсу в Go-оригинале и его тестам
    - Размер задачи — итоговый diff не более ~500 строк нового кода + тесты; если модуль больше, разбивай на подзадачи по файлам/подсистемам с явным порядком
    - Критерии приёмки каждой задачи проверяются автоматически (тесты, clippy/fmt чистые, parity-чек против оракула где применимо) — человек ревьюит только diff и соответствие плану
    - Задача не начинается, пока её зависимости не завершены; порядок задач в tasks.md отражает граф зависимостей

  operations:
    - apply — перед завершением задачи прогнать cargo clippy --all-targets (без замечаний), cargo fmt --check (чисто) и cargo test (зелёно, с учётом build-features FTS5); сводка задачи компактно — изменённые файлы, результат проверки, отклонения от плана
    - archive — в сводке архивации указать результаты parity-проверок change'а и оставшиеся риски
