schema: spec-driven

# ─────────────────────────────────────────────────────────────────────
# Project context — shown to the AI when creating artifacts
# ─────────────────────────────────────────────────────────────────────
context: |
  ## Project
  Synopsis — a local RAG + knowledge-graph MCP server in Rust for personal
  use.

  ## Target stack (frozen)
  - Rust + tokio (async runtime) + axum (HTTP for non-MCP endpoints, e.g. /health)
  - rusqlite (bundled + fts5) — SQLite storage; FTS5 is always available, no cgo flags.
    Migrations: rusqlite_migration 2.x (from-directory), PRAGMA user_version — the sole
    source of truth for schema state; _schema_migrations is not created (decisions 2026-08-18)
  - ort (ONNX Runtime, external .so/.dylib) — embeddings (bge-m3 int8, 1024-dim) and NER;
    the runtime is downloaded to data/ per onnx.yaml (registry: URL + size_bytes + sha256-verify).
    The bindings crate is deferred: the final pin — in change `embedding` (ADR 0002)
  - usearch 2.x (C++11 HNSW core via cxx, disk-backed, scalar-quantized default bf16,
    WAL + segments per ADR 0004) — the sole ANN engine, replaces vec0 brute-force.
    Vectors are NOT read from the old vec0: they are rebuilt from chunk text
  - rmcp 3.x — MCP protocol (Streamable HTTP (design D8) + legacy HTTP+SSE
    (override D8, human decision 2026-08-31, change `add-legacy-sse-transport`,
    wire contract mcp-go v0.57.0)); cel-interpreter — entity-linking expressions;
    tokenizers, notify, indicatif
  - tokio-cron-scheduler — was in the stack, removed in change `document-jobs-queue`
    (task 1.9): the standalone orphan-cleanup scheduler was replaced by GC inside the
    worker; the dependency became orphaned and was removed from the workspace + cli
    Cargo.toml and Cargo.lock.
  - clap 4.6.6 (Builder API) — parsing of CLI flags and subcommands (change `cli`,
    user-approved stack extension 2026-08-27; help text — functional equivalence
    only, byte-identity not required)
  - tracing 0.1.44 + tracing-subscriber 0.3.23 — structured logging in `cli`
    (serve/sync/load-test); the libraries remain logger-less (user-approved stack
    extension 2026-08-27)

  ## Hard constraints
  - Target: laptop (16 GB RAM), personal use, NOT a server. At N=1M × 1024-dim
    full-precision vectors (~4 GB) do not fit in RAM → the index must be
    disk-backed/mmap + a quantized graph. The query path does not load the embedding model.
  - One local binary, no external services.
  - Rust builds its own DB from scratch: one squashed init migration; legacy knowledge.db
    is NOT opened, NOT upgraded, data is NOT migrated (decisions 2026-08-18,
    design D6). The v5 schema shape (5 migrations) — a structural contract.

  ## Execution model (IMPORTANT for task decomposition)
  - The AI writes the implementation; the human is only responsible for reviewing
    process and contracts.
  - The orchestrator runs DIFFERENT agents at different stages/tasks: each agent
    starts WITHOUT memory of previous sessions. The agent's context budget is
    ~100k tokens — a task must fit entirely within it (body + module code + tests +
    references to fixtures and contracts).
  - Parity is checked BY THE MACHINE: differential tests against recorded fixtures,
    recall@k + p50/p95 gates for ANN. The human reviews contracts and deviations,
    not lines of code.

  ## Principles (human decisions, 2026-08-18)
  - Before choosing any library/framework — check online for the most suitable
    candidates for the task (in Rust: other template engines, HTTP clients,
    serialization, etc.). Verify versions, MSRV, support status, and CVEs against
    official sources.

# ─────────────────────────────────────────────────────────────────────
# Rules for artifacts
# ─────────────────────────────────────────────────────────────────────
rules:
  proposal:
    - Keep the scope to a single module or a single stage
    - Always state which frozen contracts (MCP tools / CLI / data schema / config) are touched and how parity is confirmed
    - The "Non-goals" section is mandatory

  design:
    - Every decision — with a reason (why not the alternative)
    - Changing a frozen contract is a separate decision with explicit justification
    - State which recorded fixtures and contract specs are the reference for this design

  specs:
    - The contract specs (mcp-contract, cli-surface, data-schema, config-format) pin the behavior as-is; the sources of truth — the specs themselves and the recorded fixtures
    - Requirements are expressed through scenarios (Given/When/Then), testable

  tasks:
    - DECOMPOSITION FOR THE AGENT CONTEXT — each task is executed by a fresh agent with no memory of previous tasks. The task body must be self-contained at a ~100k token budget, namely — goal, exact file scope, dependencies (which tasks/modules must already exist), acceptance criteria, references (recorded fixtures, contract specs)
    - Task size — the final diff no more than ~500 lines of new code + tests; if a module is larger, split into subtasks by files/subsystems with an explicit order
    - Each task's acceptance criteria are checked automatically (tests, clippy/fmt clean, a parity check against recorded fixtures where applicable) — the human reviews only the diff and its match to the plan
    - A task does not start until its dependencies are complete; the order of tasks in tasks.md reflects the dependency graph

  operations:
    - apply — before finishing a task, run cargo clippy --all-targets (no warnings), cargo fmt --check (clean) and cargo test (green, accounting for the FTS5 build features); the task summary is compact — changed files, check results, deviations from the plan
    - archive — in the archive summary, state the change's parity-check results and the remaining risks
