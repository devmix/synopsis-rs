[package]
name = "graph"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

# D1 edges (design.md): SQLite is the source of truth (db crate DAOs), the
# petgraph DiGraph + HashMap name/type indexes are a derived read-only
# in-memory index; CEL entity-linking expressions run on the `cel` crate
# (D2, replaces cel-interpreter). Feasibility gate for both new dependencies
# passed in task 1.1 (host build, zigbuild windows-gnu + aarch64-apple-darwin,
# cel API verified against registry sources).
[dependencies]
config = { workspace = true }
db = { workspace = true }
# In-memory graph index (D1): DiGraph + name->NodeId / type->nodes HashMaps.
petgraph = { workspace = true }
# CEL engine for ontology linking rules (D2/D5): custom functions facts(),
# has_fact(), chunks(), chunk_contains(), neighbors(), path_exists().
cel = { workspace = true }
# Error types for library crates (workspace convention).
thiserror = { workspace = true }
# Prompt template engine (llm change, design D3): the entity-linker system/user
# prompts are rendered with minijinja (embedded defaults + user overrides).
# sha2 (already in the palette) hashes the template sources for the D4 cache key.
# serde (derive) serializes the render-input structs into a minijinja `Value`.
minijinja = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
# OpenAI-compatible LLM client (llm change 2.2, design D1/D6): the `llm`
# linking method posts one chat completion per candidate pair.
llm = { workspace = true }
# JSON wire format for the LLM decision: strict parse of the response and the
# `app_kv` cache value (design D4/D6).
serde_json = { workspace = true }
