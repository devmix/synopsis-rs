[package]
name = "spikes"
version.workspace = true
edition.workspace = true

# One-shot native-seam prototype crate (design D1): bin targets s1_sqlite,
# s2_onnx, s3a_usearch and s3b_lance. Created by change native-seam-spikes
# (task 0.2) and deleted after the ADRs are written (task 5.x). Reusable logic
# is rewritten in the product crates rather than ported from here; this crate
# is not part of the product dependency graph (D1).

[lints]
workspace = true

# Spike dependencies land with their tasks: ort + tokenizers (task 2.1), usearch
# (task 3.1), lance (task 3.2). Their binaries stay sealed stubs until then.
[dependencies]
# Task 0.1 one-shot provenance probe (probe_db); task 1.1 reuses it for s1_sqlite.
rusqlite.workspace = true
libsqlite3-sys.workspace = true # forces the source-compiled SQLite build (design D3)
# Spike S1 (task 1.1): compile-time-embedded migrations applied to a fresh DB;
# PRAGMA user_version is the schema-state source of truth (design D6).
rusqlite_migration.workspace = true
include_dir.workspace = true # builds the Dir embedded into rusqlite_migration::from_directory
