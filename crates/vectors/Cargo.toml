[package]
name = "vectors"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

# ANN engine selection (add-usearch-ann-engine, task 1.1): compile-time
# features. `engine-lance` (default) keeps the existing LanceDB path (ADR
# 0003); `engine-usearch` adds the USearch candidate. Both may be enabled at
# once during the comparison period (design.md).
[features]
default = ["engine-usearch"]
engine-lance = ["dep:lancedb"]
engine-usearch = ["dep:usearch", "dep:cxx", "dep:rayon", "dep:rusqlite", "dep:libsqlite3-sys"]

# D1 tier 0: no internal dependencies. The ANN engine (usearch vs lance) is a
# new crate dependency chosen by native-seam-spikes; consumers know only the trait (D5).
[dependencies]
# ANN engine (ADR 0003): LanceDB local-filesystem mode, behind the default
# `engine-lance` feature. Feasibility gate (task vectors 1.1) passed: host
# build, spot cross-compilation, binary size.
lancedb = { workspace = true, optional = true }
# Dedicated tokio runtime inside the engine (design D2, task vectors 1.3).
tokio = { workspace = true }
# Consuming LanceDB query result streams (task vectors 1.3; in the lock
# graph via lancedb).
futures = { workspace = true }
# Error types for library crates (workspace convention).
thiserror = { workspace = true }
# ANN engine candidate (add-usearch-ann-engine task 1.1): USearch 2.26 C++11
# core behind cxx FFI; quantized (U8) disk-backed HNSW.
usearch = { workspace = true, optional = true }
# cxx FFI error type (`cxx::Exception`) returned by the usearch API.
cxx = { version = "1", optional = true }
# Concurrent batch-insert pool for the usearch engine (add-usearch-ann-engine
# task 1.2, design.md: "chunked single add via rayon pool — the index is
# concurrent"). rayon 1.12.0 (2026-04-14, MIT OR Apache-2.0): pure Rust with
# zero native dependencies, MSRV 1.63 < pinned Rust 1.96.0 — cross-compiles
# on all 5 CI targets like the rest of the stack. Gated behind `engine-usearch`
# so the default (lance) build graph is unchanged.
rayon = { version = "1", optional = true }
# SQLite WAL for the usearch engine (usearch-wal-persistence task 2.2): the
# engine journals operations to the `usearch_vectors_log` table (migration
# 3-usearch-vectors-log, db crate). Tier 0 forbids a `db` dependency, so the
# consumer injects an open connection via `UsearchEngine::with_wal_db`. Same
# bundled SQLite build as the db crate (workspace palette: the direct
# libsqlite3-sys dep forces `bundled`; cargo forbids enabling it transitively
# through rusqlite).
rusqlite = { workspace = true, optional = true }
libsqlite3-sys = { workspace = true, optional = true }

# cxx-build compiles the usearch C++ core at build time (task 1.1).
[build-dependencies]
cxx-build = "1"

# Persistence integration tests (usearch-wal-persistence task 3.10): the
# tests create and inspect the `knowledge.db` fixture (the
# `usearch_vectors_log` table) directly. Same bundled SQLite build as the
# engine's optional dependency (the direct libsqlite3-sys dev-dep forces
# `bundled`; cargo forbids enabling it transitively through rusqlite).
[dev-dependencies]
rusqlite = { workspace = true }
libsqlite3-sys = { workspace = true }

# The ADR 0003 machine gates (task vectors 1.6/1.8) exercise `LanceEngine`
# directly, so they only build when the lance engine is enabled (task 1.1
# feature gating; mirrored usearch gates arrive with tasks 1.2/1.4).
[[test]]
name = "integration_gates"
required-features = ["engine-lance"]

[[test]]
name = "full_benchmark"
required-features = ["engine-lance"]

# Persistence integration tests (usearch-wal-persistence task 3.10, ADR 0004
# §8): end-to-end restart, WAL supersession/delete, compaction, and
# parallel-search correctness. They exercise the usearch engine, so they only
# build when that engine feature is enabled.
[[test]]
name = "persistence_integration"
required-features = ["engine-usearch"]
