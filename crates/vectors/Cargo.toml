[package]
name = "vectors"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

# D1 tier 0: no internal dependencies. The ANN engine (usearch vs lance) is a
# new crate dependency chosen by native-seam-spikes; consumers know only the trait (D5).
[dependencies]
# ANN engine (ADR 0003): LanceDB local-filesystem mode. Feasibility gate
# (task vectors 1.1) passed: host build, spot cross-compilation, binary size.
lancedb = { workspace = true }
# Dedicated tokio runtime inside the engine (design D2, task vectors 1.3).
tokio = { workspace = true }
# Consuming LanceDB query result streams (task vectors 1.3; in the lock
# graph via lancedb).
futures = { workspace = true }
# Error types for library crates (workspace convention).
thiserror = { workspace = true }
