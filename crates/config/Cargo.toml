[package]
name = "config"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

# D1 tier 0: no internal dependencies. External deps (noyalib, serde) arrive
# with the config module change; thiserror via workspace palette (D4).
[dependencies]
serde = { workspace = true }
noyalib = { workspace = true }
thiserror = { workspace = true }
# Extraction-rule patterns compiled at load time (config-module D5, task 3.1b); palette entry
# carries the version verification comment.
regex = { workspace = true }

# XML deserialization for global.xml (config-module D3, format per D15 revision 4 of
# 2026-08-19): typed serde structs instead of the event stream. `serialize` is the core;
# `overlapped-lists` (both named in the task's dependency list) keeps quick-xml tolerant of
# interleaved children like the oracle's encoding/xml: with the revision-4 format every run now
# sits inside its own plural wrapper, so this file parses either way — but a stray foreign child
# would otherwise truncate a repeated-element list. Version verified online by the implementer
# against crates.io 2026-08-19: quick-xml 0.41.x current stable; MSRV 1.86 below our pinned
# Rust 1.96.0; no known CVEs for the locked version.
quick-xml = { version = "0.41", features = ["serialize", "overlapped-lists"] }
