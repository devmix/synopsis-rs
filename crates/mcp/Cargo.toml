[package]
name = "mcp"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

# D1 edges; oracle imports: ../synopsis/internal/mcp + internal/mcp/handlers
# (config, database, graph, search). rmcp features: server role + Streamable
# HTTP transport (design D8).
[dependencies]
# Opaque cursor base64 for the paginated catalog tools (task 5.2); the wire
# format is byte-compatible with the Go oracle's pagination.go.
base64 = { workspace = true }
axum = { workspace = true }
# D1 layering (design.md): mcp depends on {config, db, search, graph}.
# `config` is consumed by the 5.10 assembly (server name/version, graph
# enablement); the 5.1 scaffold injects those as plain values.
config = { workspace = true }
db = { workspace = true }
graph = { workspace = true }
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
search = { workspace = true }
# Legacy SSE transport (add-legacy-sse-transport D3): sse-stream serializes the
# SSE frames, tokio-stream adapts the mpsc receiver to the body stream, uuid
# mints the session ids. All three are already in the lock via rmcp, so no new
# package enters Cargo.lock.
sse-stream = { workspace = true }
tokio-stream = { workspace = true }
uuid = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }

# Test-only. `ServiceExt::oneshot` drives the composed axum router in the
# unit tests (no live listener). Task 5.10 adds the full wire round-trip:
# rmcp's client role + reqwest-backed Streamable HTTP client transport, and
# reqwest for the plain-HTTP GET /health assertion (workspace palette entry,
# `json` only).
# tokio `test-util` (task 1.5): the idle-reaper tests use the paused clock
# (`#[tokio::test(start_paused = true)]`, which auto-advances virtual time as
# the tests sleep) — tokio's `full` feature does not include `test-util`, so
# it is enabled here, test-only (no effect on the production binary, no new
# packages).
[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
tokio = { workspace = true, features = ["test-util"] }
tower = { version = "0.5", features = ["util"] }
