[package]
name = "parity-harness"
version.workspace = true
edition.workspace = true

# Dev-tooling crate (design D6): parity fixtures, MCP client wrapper with p50/p95
# timing instrumentation, and JSON/text diff utilities. Not part of the product
# dependency graph (D1); consumed by later module changes' acceptance tests.
[lints]
workspace = true

# MCP protocol: official SDK rmcp over Streamable HTTP (design D8, task 3.1).
# Client path: `client` + reqwest-backed streamable-HTTP transport; the `reqwest`
# feature selects the rustls TLS provider for that transport's HTTP stack.
[dependencies]
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest", "reqwest"] }
serde_json = { workspace = true }
# SYNX fixture format (vectors change, native-seam-spikes D4): the harness is the
# consumer of `vectors::synx` (vectors design D6). parity-harness sits outside the
# product dependency graph (D1), so depending on `vectors` is fine.
vectors = { workspace = true }
# Legacy SSE client (add-legacy-sse-transport task 1.4): the harness drives the
# oracle's HTTP+SSE wire contract (`GET /sse` + `POST /message`) directly with
# reqwest. The `stream` feature enables `Response::bytes_stream()`; reqwest
# 0.13.4 is already in the lock graph (rmcp's Streamable HTTP client transport
# depends on it), and `stream` pulls only already-locked crates (futures-core /
# futures-util / tokio-util + the tokio `fs` feature) — verified: no new
# `[[package]]` entries in Cargo.lock. `tokio-stream` (already in the lock via
# rmcp) provides `StreamExt` for driving the byte stream.
reqwest = { workspace = true, features = ["stream"] }
tokio-stream = { workspace = true }
# The per-frame read deadline uses `tokio::time::timeout`; `tokio` (full,
# already in the lock) is a direct dependency of the lib for that.
tokio = { workspace = true }

# Round-trip integration test (task 3.1 acceptance b): in-process rmcp
# Streamable HTTP server from the same crates.io release as the client.
#
# Latency parity test (task 1.3): in-process PRODUCT MCP server over a small
# corpus ingested through the ingestion crate. parity-harness sits outside the
# product dependency graph (D1), so depending on the product crates as
# dev-deps only is fine (the same precedent as `vectors` above).
[dev-dependencies]
rmcp = { workspace = true, features = ["server", "transport-streamable-http-server"] }
tokio = { workspace = true }
axum = { workspace = true }
config = { workspace = true }
db = { workspace = true }
graph = { workspace = true }
search = { workspace = true }
ingestion = { workspace = true }
embedding = { workspace = true }
mcp = { workspace = true }
vectors = { workspace = true }
