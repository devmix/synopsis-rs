[package]
name = "ingestion"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

# D1 edges: config is the only internal dependency this crate needs — the
# chunkers take their `ChunkingConfig` / `MarkdownChunkerConfig` from it
# (task 1.3+). The oracle's imports of database/embedding/relations come back
# with later changes (pipeline DB writes, NER via the embedding crate); YAGNI.
[dependencies]
config = { workspace = true }
# thiserror for IngestionError (workspace convention, config-module D4).
thiserror = { workspace = true }
# Format-specific metadata bag: `serde_json::Map<String, Value>` (BTreeMap-
# backed by default: key-sorted, deterministic ordering for parity diffs).
serde_json = { workspace = true }
# `Deserialize` derive for the mediawiki page struct (task 1.7); workspace
# pin (serde 1.x, `derive` feature) — no new crate, palette entry only.
serde = { workspace = true }
# `regex` for the NER rule engine (ingestion-ner task 2.1): prepared rules
# hold the config loader's compiled patterns (config design D5) as
# `regex::Regex`. Declared explicitly even though `ignore` already pulls the
# crate transitively (workspace convention).
regex = { workspace = true }
# gitignore-style `.synignore` matching in the shared walk helper (task 1.2b):
# user exclusions for source trees, all parsers inherit them.
ignore = { workspace = true }
# HTML -> Markdown conversion for the webpage parser (task 1.8): `.html`
# pages are converted to Markdown so the injected markdown chunker can split
# them on ATX headings, like the oracle's html-to-markdown library.
html-to-markdown-rs = { workspace = true }
# Jinja2 engine for the NER prompt templates (ingestion-ner task 2.2):
# embedded defaults via include_str! + user overrides, same pattern as the
# graph crate's entity-linker prompts (workspace pin: 2.x, serde +
# std_collections). `builtins` adds the standard filter set — the templates
# use the built-in `join` filter (the graph crate registers its own `join`
# function because it renders without this feature).
minijinja = { workspace = true, features = ["builtins"] }
# Template-source SHA-256 hashes feeding the LLM-NER cache key (ingestion-ner
# design D4; also used by the task 2.4 cache-key builder).
sha2 = { workspace = true }
# LLM-NER response cache (ingestion-ner task 2.4, design D6): bound to the db
# crate's unified executor surface (ConnectionOrTx), same shape as the db
# crate's own DAOs.
db = { workspace = true }
# Synchronous OpenAI-compatible chat client for the LlmNer provider
# (ingestion-ner task 2.5, design D5): per-domain structured calls with the
# generated JSON schema under the `ner_result` name.
llm = { workspace = true }
# Progress bar for the run tracker (task 3.1): stderr bar auto-hidden when
# stderr is not a terminal, so headless runs stay quiet.
indicatif = { workspace = true }
