[package]
name = "ingestion"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

# D1 edges: config is the only internal dependency this crate needs — the
# chunkers take their `ChunkingConfig` / `MarkdownChunkerConfig` from it
# (task 1.3+). The oracle's imports of database/embedding/relations come back
# with later changes (pipeline DB writes, NER via the embedding crate); YAGNI.
[dependencies]
config = { workspace = true }
# thiserror for IngestionError (workspace convention, config-module D4).
thiserror = { workspace = true }
# Format-specific metadata bag: `serde_json::Map<String, Value>` (BTreeMap-
# backed by default: key-sorted, deterministic ordering for parity diffs).
serde_json = { workspace = true }
# `Deserialize` derive for the mediawiki page struct (task 1.7); workspace
# pin (serde 1.x, `derive` feature) — no new crate, palette entry only.
serde = { workspace = true }
# gitignore-style `.synignore` matching in the shared walk helper (task 1.2b):
# user exclusions for source trees, all parsers inherit them.
ignore = { workspace = true }
