[package]
name = "cli"
version.workspace = true
edition.workspace = true

[lints]
workspace = true

# Binary name matches the Go oracle artifact (../synopsis/bin/synopsis).
[[bin]]
name = "synopsis"
path = "src/main.rs"

# D1 edges; oracle imports: ../synopsis/cmd/app (config, database, onnx/embedding,
# graph, mcp, search). clap/tracing arrive with the CLI-surface change (task 1.1);
# ingestion/utils/vectors are declared now for the later subcommand tasks
# (1.3-1.10) per the D1 edge list.
[dependencies]
axum = { workspace = true }
clap = { workspace = true }
config = { workspace = true }
db = { workspace = true }
embedding = { workspace = true }
graph = { workspace = true }
ingestion = { workspace = true }
mcp = { workspace = true }
rusqlite = { workspace = true }
search = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
notify = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utils = { workspace = true }
vectors = { workspace = true }

[features]
default = ["engine-usearch"]
engine-lance = ["vectors/engine-lance"]
engine-usearch = ["vectors/engine-usearch"]

[dev-dependencies]
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
vectors = { workspace = true, features = ["engine-lance"] }
